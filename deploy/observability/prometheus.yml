# Prometheus reads the app's metrics over the compose network; the port is never published,
# and the Cloudflare tunnel routes only to the app's port 8000.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sreditor
    static_configs:
      - targets: ["sreditor:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
